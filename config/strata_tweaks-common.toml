#Skip Steam 'n' Rails' and Brewin' and Chewin' extra data-fixer passes when a structure template
#(a saved building piece) is read. Those passes tripled the cost of reading templates, which runs
#on the main thread and froze the server for seconds while players explored.
skipModStructureFixers = true
#Multiplier for the natural hostile mob cap (vanilla 70 per player area). 1.0 = vanilla.
# Default: 0.8
# Range: 0.1 ~ 2.0
monsterCapScale = 0.8
#In the Abyssal Plain, a dry room a player stands in must have a Create: Deep Seas Oxygen Diffuser
#holding oxygen, or it floods (see AbyssalAir). The Lifepod and ships are exempt.
abyssalRoomsNeedOxygen = true
#In the Abyssal Plain, an Oxygen Diffuser holding oxygen pushes the water out of a closed room,
#from the ceiling down (nothing else can dry a room there). Does nothing in a space open to the sea.
abyssalDiffusersPushWater = true
#How deep the Carapace Diving Suit (tier 2) holds out, in metres of water. Deep Seas' Copper Diving Suit
#holds to 280 m; 60 m past a suit's limit kills. 0 = no limit.
# Default: 420
# Range: 0 ~ 100000
divingSuitDepthCarapace = 420
#The same for the Abyssal Diving Suit (tier 3). 0 = no limit.
# Default: 0
# Range: 0 ~ 100000
divingSuitDepthAbyssal = 0
#Share of the Leviathan's laser damage a diver in the full Abyssal Diving Suit takes (about 10 a hit,
#three hits a second, hardly reduced by armour). 1.0 = no protection.
# Default: 0.25
# Range: 0.0 ~ 1.0
abyssalSuitLaserScale = 0.25
#Multiplier for Vampirism's own spawn cap for vampires (30 per player area, separate from the
#hostile mob cap above). 1.0 = as the mod ships.
# Default: 0.4
# Range: 0.0 ~ 2.0
vampireCapScale = 0.4
#Chance that a vampire mob's bite infects the player with Sanguinare Vampiris. The mod infects on
#every bite (1.0). A vampire player infecting someone on purpose is not affected.
# Default: 0.15
# Range: 0.0 ~ 1.0
vampireBiteInfectChance = 0.15
