# Strata overrides for ModernFix. ModernFix keeps these lines and regenerates its comments around them.
# Load block/item models on demand instead of all at startup: the main memory fix for a pack this size
# (Every Compat alone adds thousands of block variants). First client test ran out of memory at 6 GB without it.
mixin.perf.dynamic_resources=true
# Keep structure templates loaded once read (Nov 11). With this on, ModernFix holds them as soft references that
# Java drops under memory pressure, and the server re-reads and data-fixes each template on the main thread when
# the next chunk with that structure loads: 2-15 s stalls (and boat rubberbanding) while exploring.
mixin.perf.dynamic_structure_manager=false
